name: CI

# Pull requests, plus pushes to main. Other branch pushes are covered by their
# pull request, so they would only run twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The backend tests' database: same image as docker-compose.yml, on the
    # port and credentials TEST_DATABASE_URL defaults to (localhost:5432,
    # postgres/postgres).
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Lint, Prettier, type checks, and the backend's integration tests.
      - run: npm run check
